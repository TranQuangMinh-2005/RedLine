services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_DB: redline
    expose:
      - "5432"
    # Mở ra localhost cho harness thu evidence `database`:
    #   --database postgresql://redline:redline@localhost:5433/redline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline"]
      interval: 5s
      timeout: 5s
      retries: 5

  target:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override cho từng run, ví dụ: DEFENSE_PROFILE=strict make up
      DEFENSE_PROFILE: ${DEFENSE_PROFILE:-none}
      DATABASE_URL: postgresql://redline:redline@db:5432/redline
      # Llama Guard chạy local trong service llama-guard (make llama-guard-up)
      LLAMA_GUARD_BASE_URL: ${LLAMA_GUARD_BASE_URL:-http://llama-guard:8080/v1}
      PROMPT_GUARD_URL: ${PROMPT_GUARD_URL:-http://prompt-guard:8000}
      ENABLE_TEST_FIXTURES: "true"
      ENABLE_TOOLS: ${ENABLE_TOOLS:-true}
      AUDIT_LOG_PATH: data/audit.jsonl
    # Cho phép endpoint http://host.docker.internal:11434/v1 (Ollama trên máy host)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Chốt Llama Guard local: llama.cpp server (CPU) + GGUF Llama-Guard-3-1B Q4_K_M (~1 GB).
  # Chỉ chạy khi bật profile:  make llama-guard-up
  # --jinja dùng chat template Llama Guard nhúng trong GGUF (model trả "safe" / "unsafe\nS1").
  llama-guard:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llama-guard"]
    command:
      - -m
      - /models/${LLAMA_GUARD_GGUF:-Llama-Guard-3-1B.Q4_K_M.gguf}
      - --alias
      - ${LLAMA_GUARD_MODEL:-Llama-Guard-3-1B-Q4_K_M}
      - --jinja
      - -c
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "8088:8080"
    volumes:
      - ./data/models:/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Chốt Prompt Guard 2 (86M) local CPU: phát hiện prompt injection / jailbreak.
  # Model gated trên Hugging Face -> cần HF_TOKEN đã được Meta duyệt.  make prompt-guard-up
  prompt-guard:
    build: ./services/prompt_guard
    profiles: ["prompt-guard"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      MODEL_DIR: /models/Llama-Prompt-Guard-2-86M
    ports:
      - "8089:8000"
    volumes:
      - ./data/models:/models
    restart: unless-stopped

volumes:
  pgdata:

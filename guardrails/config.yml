# Profile mặc định lấy từ DEFENSE_PROFILE. active_profile là fallback khi caller
# không truyền profile. Mỗi benchmark run chỉ dùng một profile cố định.
profiles:
  none:
    input_filter: false
    output_filter: false
    prompt_hardening: false
    canary_check: false
  basic:
    input_filter: true
    output_filter: false
    prompt_hardening: true
    canary_check: true
  strict:
    input_filter: true
    output_filter: true
    prompt_hardening: true
    canary_check: true

active_profile: none

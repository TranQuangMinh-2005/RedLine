[project]
name = "redline"
version = "0.1.0"
description = "A sandboxed customer-support agent for adversarial security evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyngrok>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]
lint = [
    "mypy>=1.11,<2",
    "ruff>=0.8,<1",
]

[tool.uv]
exclude-newer = "2025-01-31T00:00:00Z"
package = false

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
